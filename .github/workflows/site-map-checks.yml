name: Site map quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  site-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check JavaScript, local destinations, and protected homepage
        run: python3 scripts/check-site.py
