<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homepage Feature Artwork | Amanda Rose</title><style>*{box-sizing:border-box}body{margin:0;background:#fff5ee;color:#70244f;font:16px/1.5 Arial,sans-serif}header{background:#75234f;padding:20px 5%;color:white}header a{color:white}main{max-width:1100px;margin:auto;padding:25px 20px 70px}h1,h2{font-family:Georgia,serif}.panel{background:white;padding:24px;border-radius:20px;margin:18px 0;border:1px solid #efd4e0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.tile{background:white;border-radius:20px;overflow:hidden;border:1px solid #efd4e0}.tile img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#f8dce7}.tile .inner{padding:18px}.tile input{width:100%;margin:12px 0}button{background:#e92d85;color:white;border:0;border-radius:24px;padding:12px 20px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.status{font-size:14px;min-height:24px}.error{color:#ad214d}label{display:block;margin:10px 0;font-weight:bold}label input{display:block;width:100%;padding:10px;border:1px solid #d9b6c8;border-radius:10px}#workspace[hidden],#auth[hidden]{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="rose-global-header.css"></head><body><header><a href="publishing-calendar.html">← Publishing Calendar</a> · <a href="banner-studio.html">Banner Studio</a> · <a href="index.html">Homepage</a></header><main><h1>Homepage Feature Artwork</h1><p>Upload the six new 16:9 designs. Each image replaces its homepage card automatically. Artwork is shown in full, without cropping or blurred sidebars.</p><section class="panel" id="auth"><h2>Administrator sign-in</h2><form id="login"><label>Email<input type="email" id="email" required></label><label>Password<input type="password" id="password" required></label><button>Sign in</button></form></section><section id="workspace" hidden><div class="grid" id="tiles"></div></section><p id="message" role="status" aria-live="polite"></p></main><script src="rose-supabase.js"></script><script src="rose-admin-session.js"></script><script>(()=>{'use strict';const cfg=window.ROSE_SUPABASE,auth=window.RoseAdminSession,items=[['Unbox','unbox'],['Beauty Life','beauty-life'],['Meet Delores','meet-delores'],['Shop & Save','shop-save'],['The Rose Journal','rose-journal'],['Watch Now','watch-now']];const $=id=>document.getElementById(id);function show(){ $('auth').hidden=true;$('workspace').hidden=false;const root=$('tiles');root.replaceChildren();for(const [title,slug] of items){const card=document.createElement('article');card.className='tile';const img=document.createElement('img');img.alt=title+' preview';img.src=cfg.url+'/storage/v1/object/public/rose-banners/homepage-cards/'+slug+'.webp?v='+Date.now();const inner=document.createElement('div');inner.className='inner';const heading=document.createElement('h2');heading.textContent=title;const input=document.createElement('input');input.type='file';input.accept='image/jpeg,image/png,image/webp';input.setAttribute('aria-label','Select image for '+title);const btn=document.createElement('button');btn.textContent='Upload '+title;const status=document.createElement('p');status.className='status';btn.onclick=async()=>{const file=input.files?.[0];if(!file){status.textContent='Select an image first.';return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10485760){status.textContent='Choose a JPG, PNG or WebP under 10 MB.';return}btn.disabled=true;status.textContent='Preparing image…';try{const s=await auth.ensure();if(!s)throw Error('Please sign in again.');const bitmap=await createImageBitmap(file);const canvas=document.createElement('canvas');const max=1600,scale=Math.min(1,max/bitmap.width,max/bitmap.height);canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.88));if(!blob)throw Error('Could not process image.');status.textContent='Uploading…';const path='homepage-cards/'+slug+'.webp';const r=await fetch(cfg.url+'/storage/v1/object/rose-banners/'+path,{method:'POST',headers:{apikey:cfg.key,Authorization:'Bearer '+s.access_token,'Content-Type':'image/webp','x-upsert':'true'},body:blob});if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.message||d.error||'Upload failed ('+r.status+'). Check storage update permissions.')}img.src=cfg.url+'/storage/v1/object/public/rose-banners/'+path+'?v='+Date.now();status.textContent='✓ Uploaded! Homepage artwork updated.'}catch(e){status.textContent=e.message}finally{btn.disabled=false}};inner.append(heading,input,btn,status);card.append(img,inner);root.append(card)}}$('login').onsubmit=async e=>{e.preventDefault();try{await auth.signIn($('email').value,$('password').value);$('password').value='';show()}catch(e){$('message').textContent=e.message}};auth.ensure().then(s=>{if(s)show()}).catch(e=>$('message').textContent=e.message)})();</script><script src="rose-global-header.js"></script></body></html>
