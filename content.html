yId('player-modal'),playerHost=document.getElementById('player-host');let lastFocus=null;function closePlayer(){playerHost.replaceChildren();document.getElementById('player-controls').hidden=true;modal.hidden=true;document.body.style.overflow='';lastFocus?.focus()}document.getElementById('player-close').onclick=closePlayer;modal.addEventListener('click',e=>{if(e.target===modal)closePlayer()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closePlayer()});function playVideo(o,button){const link=safe(o.media_url);if(!link)return;const id=youtubeId(link);const host=new URL(link).hostname.toLowerCase();const facebook=['facebook.com','www.facebook.com','m.facebook.com','web.facebook.com','fb.watch'].includes(host);lastFocus=button;playerHost.replaceChildren();modal.querySelector('.player-shell').style.width='';document.getElementById('player-controls').hidden=true;let media;if(id){media=document.createElement('iframe');media.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0';media.title=o.title;media.allow='accelerometer;autoplay;encrypted-media;gyroscope;picture-in-picture;web-share';media.allowFullscreen=true;if(new URL(link).pathname.startsWith('/shorts/'))media.classList.add('portrait')}else if(/\.(mp4|webm|ogg)(?:$|[?#])/i.test(link)){media=document.createElement('video');media.src=link;media.controls=true;media.autoplay=true;media.playsInline=true}else if(['www.tiktok.com','tiktok.com','m.tiktok.com'].includes(host)){const m=new URL(link).pathname.match(/\/video\/(\d+)/);if(m){media=document.createElement('iframe');media.src='https://www.tiktok.com/embed/v2/'+m[1];media.title=o.title;media.allowFullscreen=true}}if(!media&&['instagram.com','www.instagram.com'].includes(host)){const u=new URL(link),m=u.pathname.match(/^\/(reel|reels|p|tv)\/([A-Za-z0-9_-]+)/);if(m){media=document.createElement('iframe');media.src='https://www.instagram.com/'+(m[1]==='reels'?'reel':m[1])+'/'+m[2]+'/embed/';media.title=o.title;media.allow='autoplay;encrypted-media;picture-in-picture';media.allowFullscreen=true;media.referrerPolicy='strict-origin-when-cross-origin'}}if(!media&&facebook){media=document.createElement('iframe');media.src='https://www.facebook.com/plugins/video.php?href='+encodeURIComponent(link)+'&show_text=false&width=420';media.title=o.title;media.allow='autoplay;clipboard-write;encrypted-media;picture-in-picture;web-share';media.allowFullscreen=true;media.referrerPolicy='strict-origin-when-cross-origin'}if(!media){const note=document.createElement('p');note.textContent='This provider does not support this video format in our player.';const a=document.createElement('a');a.href=link;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open original video';playerHost.append(note,a)}else{media.classList.add('player-frame');if(facebook){media.classList.add('facebook');const controls=document.getElementById('player-controls');controls.hidden=false;const setWidth=w=>{const n=Number(w);const shell=modal.querySelector('.player-shell');shell.style.width='min(100%, '+(n+40)+'px)';media.src='https://www.facebook.com/plugins/video.php?href='+encodeURIComponent(link)+'&show_text=false&width='+n;controls.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.width)===n)))};controls.querySelectorAll('button').forEach(b=>b.onclick=()=>setWidth(b.dataset.width));setWidth(420)}else if(['instagram.com','www.instagram.com'].includes(host)){media.classList.add('instagram')}else if(media.tagName==='VIDEO'){media.classList.add('direct');media.addEventListener('loadedmetadata',()=>{if(media.videoWidth&&media.videoHeight)media.style.aspectRatio=media.videoWidth+'/'+media.videoHeight})}playerHost.append(media)}document.getElementById('player-title').textContent=o.title;modal.hidden=false;document.body.style.overflow='hidden';document.getElementById('player-close').focus()}const categories={comedy:'Comedy',beauty:'Beauty',fashion:'Fashion',faith:'Faith',mom:'Mom Life',lifestyle:'Lifestyle'};function youtubeId(url){try{const u=new URL(url);const host=u.hostname.toLowerCase();if(host==='youtu.be'||host==='www.youtu.be')return u.pathname.split('/')[1]||'';if(['youtube.com','www.youtube.com','m.youtube.com'].includes(host)){if(u.pathname==='/watch')return u.searchParams.get('v')||'';const m=u.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/);return m?m[1]:''}}catch{}return ''}function safe(url){try{const u=new URL(url);return u.protocol==='https:'?u.href:null}catch{return null}}fetch(cfg.url+'/rest/v1/creator_content?select=*&status=eq.published&order=created_at.desc',{headers:{apikey:cfg.key},cache:'no-store'}).then(async r=>{if(!r.ok)throw Error('Content unavailable');const rows=await r.json();message.hidden=!!rows.length;if(!rows.length)message.textContent='Amanda’s newest stories, videos, and tutorials are coming soon.';for(const category of ['all',...new Set(rows.map(o=>o.category))]){const b=document.createElement('button');b.type='button';b.textContent=category==='all'?'All content':categories[category]||category;b.setAttribute('aria-pressed',String(category==='all'));b.onclick=()=>{filterRoot.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));root.querySelectorAll('.card').forEach(c=>c.hidden=category!=='all'&&c.dataset.category!==category)};filterRoot.append(b)}filterRoot.hidden=!rows.length;for(const o of rows){const card=document.createElement('article');card.className='card';card.dataset.category=o.category;const art=document.createElement('div');art.className='thumb';const id=o.kind==='video'?youtubeId(o.media_url):'';const image=safe(o.thumbnail_url)||(id?'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg':null)||(o.kind==='photo'?safe(o.media_url):null);if(image){const img=document.createElement('img');img.src=image;img.alt=o.title;img.loading='lazy';art.style.setProperty('--art-image','url('+JSON.stringify(image)+')');img.onload=()=>{const ratio=img.naturalWidth/img.naturalHeight;art.dataset.orientation=ratio<.85?'portrait':ratio>1.2?'landscape':'square'};img.onerror=()=>{img.remove();art.textContent=o.kind==='video'?'🎬':o.kind==='article'?'📓':'📷'};art.append(img)}else art.textContent=o.kind==='video'?'🎬':o.kind==='article'?'📓':'📷';card.append(art);const body=document.createElement('div');body.className='body';const tag=document.createElement('span');tag.className='tag';tag.textContent=(categories[o.category]||o.category)+' · '+o.kind;const title=document.createElement('h2');title.textContent=o.title;body.append(tag,title);if(o.description){const p=document.createElement('p');p.textContent=o.description;p.style.maxHeight=o.kind==='article'?'none':'145px';p.style.overflow='hidden';body.append(p)}const link=safe(o.media_url);if(link){if(o.kind==='video'){const b=document.createElement('button');b.type='button';b.textContent='▶ Watch here';b.onclick=()=>playVideo(o,b);body.append(b)}else{const a=document.createElement('a');a.href=link;a.target='_blank';a.rel='noopener noreferrer';a.textContent=o.kind==='photo'?'View photo':'Read more';body.append(a)}}card.append(body);root.append(card)}}).catch(()=>{message.textContent='Content could not be loaded. Please try again later.'})})();</script></body></html>
