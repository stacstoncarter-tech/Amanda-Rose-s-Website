<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Rose Garden | Amanda Rose Content</title><style>*{box-sizing:border-box}body{margin:0;background:#fff5eb;color:#70244f;font:16px Arial,sans-serif}header{background:#74254f;color:white;padding:18px 6%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}header a{color:white;text-decoration:none;margin-left:15px;font-weight:bold}.hero{text-align:center;padding:65px 20px;background:linear-gradient(120deg,#ffc264,#f17eaa,#ce68b3);color:white}.hero h1{font:italic bold clamp(45px,8vw,90px) Georgia,serif;margin:12px;text-shadow:3px 5px #a52d70}main{max-width:1150px;margin:auto;padding:35px 20px 75px}.filters{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 30px}.filters button{background:white;color:#74254f;border:2px solid #e92d85;border-radius:25px;padding:11px 16px;cursor:pointer;font-weight:bold}.filters button[aria-pressed=true]{background:#e92d85;color:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{background:white;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px #7d27512a}.thumb{height:230px;background:linear-gradient(125deg,#ffce75,#f29bca);display:grid;place-items:center;font-size:60px}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:22px}.body h2{font:italic bold 26px Georgia,serif;margin:10px 0}.tag{display:inline-block;background:#fff0bd;padding:7px 12px;border-radius:18px;font-size:13px;font-weight:bold}.body p{line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.body a{display:inline-block;background:#e92d85;color:white;padding:12px 18px;border-radius:24px;text-decoration:none;font-weight:bold}#message{background:white;border-radius:18px;padding:22px}footer{text-align:center;background:#74254f;color:white;padding:25px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><header><strong style="font:italic bold 26px Georgia,serif">✿ Amanda Rose</strong><nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="discount-codes.html">Discount Codes</a></nav></header><div class="hero"><div>WELCOME TO THE ROSE GARDEN</div><h1>Watch · Read · Explore</h1><p>Comedy, beauty, fashion, faith, and mom life with Amanda.</p></div><main><div id="filters" class="filters" role="group" aria-label="Filter content"></div><div id="message" role="status">Loading Amanda's latest content…</div><div id="content" class="grid" aria-live="polite"></div></main><footer>Follow Amanda Rose on Instagram, TikTok, and YouTube ♡</footer><script src="rose-supabase.js"></script><script>(()=>{'use strict';const cfg=window.ROSE_SUPABASE,root=document.getElementById('content'),message=document.getElementById('message'),filterRoot=document.getElementById('filters');const categories={comedy:'Comedy',beauty:'Beauty',fashion:'Fashion',faith:'Faith',mom:'Mom Life',lifestyle:'Lifestyle'};function youtubeId(url){try{const u=new URL(url);const host=u.hostname.toLowerCase();if(host==='youtu.be'||host==='www.youtu.be')return u.pathname.split('/')[1]||'';if(['youtube.com','www.youtube.com','m.youtube.com'].includes(host)){if(u.pathname==='/watch')return u.searchParams.get('v')||'';const m=u.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/);return m?m[1]:''}}catch{}return ''}function safe(url){try{const u=new URL(url);return u.protocol==='https:'?u.href:null}catch{return null}}fetch(cfg.url+'/rest/v1/creator_content?select=*&status=eq.published&order=created_at.desc',{headers:{apikey:cfg.key},cache:'no-store'}).then(async r=>{if(!r.ok)throw Error('Content unavailable');const rows=await r.json();message.hidden=!!rows.length;if(!rows.length)message.textContent='Amanda’s newest stories, videos, and tutorials are coming soon.';for(const category of ['all',...new Set(rows.map(o=>o.category))]){const b=document.createElement('button');b.type='button';b.textContent=category==='all'?'All content':categories[category]||category;b.setAttribute('aria-pressed',String(category==='all'));b.onclick=()=>{filterRoot.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));root.querySelectorAll('.card').forEach(c=>c.hidden=category!=='all'&&c.dataset.category!==category)};filterRoot.append(b)}filterRoot.hidden=!rows.length;for(const o of rows){const card=document.createElement('article');card.className='card';card.dataset.category=o.category;const art=document.createElement('div');art.className='thumb';const id=o.kind==='video'?youtubeId(o.media_url):'';const image=safe(o.thumbnail_url)||(id?'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg':null)||(o.kind==='photo'?safe(o.media_url):null);if(image){const img=document.createElement('img');img.src=image;img.alt=o.title;img.loading='lazy';img.onerror=()=>{img.remove();art.textContent=o.kind==='video'?'🎬':o.kind==='article'?'📓':'📷'};art.append(img)}else art.textContent=o.kind==='video'?'🎬':o.kind==='article'?'📓':'📷';card.append(art);const body=document.createElement('div');body.className='body';const tag=document.createElement('span');tag.className='tag';tag.textContent=(categories[o.category]||o.category)+' · '+o.kind;const title=document.createElement('h2');title.textContent=o.title;body.append(tag,title);if(o.description){const p=document.createElement('p');p.textContent=o.description;p.style.maxHeight=o.kind==='article'?'none':'145px';p.style.overflow='hidden';body.append(p)}const link=safe(o.media_url);if(link){const a=document.createElement('a');a.href=link;a.target='_blank';a.rel='noopener noreferrer';a.textContent=o.kind==='video'?'Watch now':o.kind==='photo'?'View photo':'Read more';body.append(a)}card.append(body);root.append(card)}}).catch(()=>{message.textContent='Content could not be loaded. Please try again later.'})})();</script></body></html>
